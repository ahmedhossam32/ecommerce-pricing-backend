# Test-classpath override: neutralizes the Postgres-specific settings in the real
# (gitignored) src/main/resources/application.properties so @DataJpaTest's embedded H2
# datasource (auto-configured via @AutoConfigureTestDatabase) isn't paired with a
# Postgres-only dialect/seed script.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.show-sql=false
